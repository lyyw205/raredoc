            - text: 싱글 카드 거래를 위한 메뉴로 카드별 등록하여 개별 가격을 매길 수 있는 것으로 보인다.
            - text: 구매자는 원하는 카드를 선택하여 거래 신청을 하는 방법으로 거래를 할 수 있고
            - text: 해당 거래글을 통해 개별 카드 시세 그래프와 평균 가격을 보여준다.
          - heading " 2.3. 콜렉션북 [편집]" [level=3] [ref=e323] [cursor=pointer]:

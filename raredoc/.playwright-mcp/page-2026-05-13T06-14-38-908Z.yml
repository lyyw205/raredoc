            - link "https://icu.gg/collection/dashboard" [ref=e335] [cursor=pointer]:
              - /url: https://icu.gg/collection/dashboard
            - text: 다른 사이트나 어플의 콜렉션북과 같은 기능을 제공한다.
            - text: 다만 다른 사이트와 다르게 집계 현황을 제공하며
            - text: 내 콜렉션북의 총 가치를 계산해 준다.
            - text: 메모 기능등이 잘되어있어 콜렉션 저장이나 포켓몬카드 재고 관리 하는 용으로 사용해도 좋을 듯 싶다

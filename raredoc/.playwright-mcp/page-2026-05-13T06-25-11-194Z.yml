              - code [ref=e239]: "{ \"data\": [{ \"sourceItemId\": \"123456789012\", \"title\": \"Pokemon Base Set Charizard PSA 10\", \"price\": 5200, \"currency\": \"USD\", \"listingUrl\": \"https://www.ebay.com/itm/123456789012\", \"grader\": \"PSA\", \"grade\": \"10\", \"soldAt\": \"2026-01-27T12:00:00.000Z\", \"anomalyFlag\": false, \"anomalyReason\": null }], \"pagination\": { \"hasMore\": true, \"nextCursor\": \"MjA=\", \"count\": 20 } }"
        - generic [ref=e240]:
          - generic [ref=e241]:
            - heading "When to Use It" [level=2] [ref=e242]
            - paragraph [ref=e244]: Use listings for comp evidence, not for normal search. Load /cards first, then fetch /listings only when the UI needs to show why a price is believable.
          - generic [ref=e245]:
            - heading "Audit Trail" [level=2] [ref=e246]
            - paragraph [ref=e248]: Show title, soldAt, price, grader, grade, listingUrl, and anomalyReason together. That gives users enough context to accept or reject a comp.
          - generic [ref=e249]:
            - heading "Filtering Strategy" [level=2] [ref=e250]
            - paragraph [ref=e252]: For slab workflows, pass grader and grade instead of parsing titles client-side. For raw workflows, use price bounds and sort order to review extreme comps.
        - region "Frequently Asked Questions" [ref=e253]:
          - heading "Frequently Asked Questions" [level=2] [ref=e254]
          - generic [ref=e255]:
            - generic [ref=e256]:
              - heading "Can I show sold eBay Pokemon card comps in my app?" [level=3] [ref=e257]
              - paragraph [ref=e258]: Yes, on Scale. The endpoint returns individual sold listings with prices, sold timestamps, grader fields, URLs, and anomaly metadata.
            - generic [ref=e259]:
              - heading "Should I call listings for every search result?" [level=3] [ref=e260]
              - paragraph [ref=e261]: No. Use /cards for search and current pricing. Use /listings when a user opens a card, audits a valuation, or needs high-confidence comp evidence.

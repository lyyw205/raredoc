          - heading "Examples" [level=2] [ref=e226]
          - generic [ref=e227]:
            - generic [ref=e228]:
              - generic [ref=e229]:
                - heading "Review high-value PSA 10 comps" [level=3] [ref=e230]
                - generic [ref=e231]: javascript
              - code [ref=e233]: "const params = new URLSearchParams({ grader: \"PSA\", grade: \"10\", min_price: \"1000\", sort: \"price_desc\", }) const response = await fetch( `https://api.poketrace.com/v1/cards/019bff77.../listings?${params}`, { headers: { \"X-API-Key\": process.env.POKETRACE_API_KEY } }, ) const { data } = await response.json()"
            - generic [ref=e234]:

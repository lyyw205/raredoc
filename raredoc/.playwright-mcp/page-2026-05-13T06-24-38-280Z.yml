          - generic [ref=e234]:
            - generic [ref=e235]:
              - heading "Can I request PSA 10 Pokemon card price history?" [level=3] [ref=e236]
              - paragraph [ref=e237]: Yes. Use the card ID and tier PSA_10 on /cards/:id/prices/:tier/history. Half grades use underscores, for example BGS_9_5.
            - generic [ref=e238]:
              - heading "How is CardMarket history different from eBay history?" [level=3] [ref=e239]
              - paragraph [ref=e240]: CardMarket AGGREGATED rows are Price Trend style values without saleCount, while cardmarket_unsold rows are active-listing summaries that can include condition, grade, country, and language breakdowns.

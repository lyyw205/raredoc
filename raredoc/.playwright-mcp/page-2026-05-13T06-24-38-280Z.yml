          - generic [ref=e46]:
            - paragraph [ref=e47]: GET /cards/:id/prices/:tier/history
            - code [ref=e49]: "curl -H \"X-API-Key: YOUR_KEY\" \\ \"https://api.poketrace.com/v1/cards/019bff77.../prices/PSA_10/history?period=30d&limit=30\""
            - paragraph [ref=e50]: Returns dated rows grouped by source with avg, low, high, sale counts, rolling medians, optional EU breakdowns, and cursor pagination.
            - list [ref=e51]:

                - generic [ref=e210]: javascript
              - code [ref=e212]: "const response = await fetch( \"https://api.poketrace.com/v1/cards/019bff77.../prices/PSA_10/history?period=30d&limit=30\", { headers: { \"X-API-Key\": process.env.POKETRACE_API_KEY } }, ) const history = await response.json() const chartPoints = history.data.map((row) => ({ x: row.date, y: row.median7d ?? row.avg, }))"

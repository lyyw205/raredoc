        - generic [ref=e219]:
          - generic [ref=e220]:
            - heading "When to Use It" [level=2] [ref=e221]
            - paragraph [ref=e223]: Use /cards for search and current prices. Use price history only after the user opens one card and asks for a chart, alert threshold, valuation audit, or tier trend.
          - generic [ref=e224]:
            - heading "Source Behavior" [level=2] [ref=e225]
            - paragraph [ref=e227]: US cards can return eBay sold-listing rows and TCGPlayer raw-condition rows. EU cards keep CardMarket Price Trend separate from CardMarket active-listing summaries.
          - generic [ref=e228]:
            - heading "Charting Rule" [level=2] [ref=e229]
            - paragraph [ref=e231]: For noisy sold-listing sources, chart median7d or median30d when present and keep avg available as the raw daily signal.
        - region "Frequently Asked Questions" [ref=e232]:

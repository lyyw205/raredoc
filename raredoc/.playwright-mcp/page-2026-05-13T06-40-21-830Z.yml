              - list [ref=e250]:
                - listitem [ref=e251]:
                  - generic [ref=e252]: 가장 흔한 경매 방식이다. 기본적으로 30초의 시간이 주어지며, 경매 종료 10초 전 새로운 입찰자가 나타날 경우 경매 종료 시간이 10초 연장된다.
            - listitem [ref=e253]:
              - generic [ref=e254]: 타임어택 경매
              - list [ref=e255]:
                - listitem [ref=e256]:
                  - generic [ref=e257]: 경매 진행 시간이 30초로 고정된 방식. 30초를 기준으로, 가장 마지막에 입찰 버튼을 누른 입찰자가 상품을 낙찰받는다.

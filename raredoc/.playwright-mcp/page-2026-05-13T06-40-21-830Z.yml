                  - generic [ref=e569]: 와이스에서 낙찰받은 상품들을 일컫는 용어. X에는 해당 상품을 경매로 방출한 딜러(판매자)의 닉네임 첫 글자를 붙여준다.
            - listitem [ref=e570]:
              - generic [ref=e571]: X 선생님 안녕하세요
              - list [ref=e572]:
                - listitem [ref=e573]:
                  - generic [ref=e574]:
                    - text: 주로
                    - deletion [ref=e575]: 품격있는 라이브
                    - text: 에서 다른 컬렉터들을 부를때 사용하는 말투. X키즈와 마찬가지로, X에는 지칭하는 컬렉터의 닉네임 첫 글자가 온다.

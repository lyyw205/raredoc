                    - text: 등 카드류 카테고리에서 주로 사용되는 경매 방식. 미개봉 팩을 경매에 부치고, 낙찰될 경우 라이브에서 해당 카드 팩을 개봉하며 모두가 함께 즐기는 경매 방식이다.

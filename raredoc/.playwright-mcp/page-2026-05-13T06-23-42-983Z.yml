      - generic [ref=e300]:
        - generic [ref=e301]:
          - heading "What payment methods do you accept?" [level=3] [ref=e302]
          - paragraph [ref=e303]: We accept all major credit cards and PayPal through Paddle.com, our payment provider. Payments are secure and PCI compliant.
        - generic [ref=e304]:
          - heading "What happens if I exceed my rate limit?" [level=3] [ref=e305]
          - paragraph [ref=e306]: "You'll receive a 429 error with rate limit headers. Burst limits are plan-based (Free: 1/2s, Pro: 30/10s, Scale: 60/10s) and reset within seconds. Daily limits reset at midnight UTC. We don't charge overage fees—just upgrade if you consistently need more."
        - generic [ref=e307]:
          - heading "Can I use the API for commercial projects?" [level=3] [ref=e308]
          - paragraph [ref=e309]: Free tier is for personal/non-commercial use only. Pro and Scale plans include full commercial usage rights.
        - generic [ref=e310]:
          - heading "How do I cancel my subscription?" [level=3] [ref=e311]
          - paragraph [ref=e312]: You can cancel anytime from your dashboard. Your access continues until the end of your current billing period. No cancellation fees.
        - generic [ref=e313]:
          - heading "What's the difference between burst and daily limits?" [level=3] [ref=e314]
          - paragraph [ref=e315]: "Burst limits are plan-based: Free = 1 request/2 seconds, Pro = 30 requests/10 seconds, Scale = 60 requests/10 seconds. Daily limits reset at midnight UTC. You need to stay within both to avoid 429 errors."
        - generic [ref=e316]:
          - heading "Do you offer custom enterprise plans?" [level=3] [ref=e317]
          - paragraph [ref=e318]: Yes! If you need higher limits, custom integrations, or dedicated infrastructure, contact us at contact@poketrace.com.

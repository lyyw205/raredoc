name: Sync Prices (daily)

# pokemontcg.io 의 TCGplayer market price 를 Price 테이블에 스냅샷.
# 매일 1회 실행 → 시계열 history 누적.
on:
  schedule:
    - cron: "0 0 * * *" # 00:00 UTC = 09:00 KST
  workflow_dispatch:

concurrency:
  group: sync-prices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - name: Run sync:prices
        run: npm run sync:prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
